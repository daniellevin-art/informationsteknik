<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="Source Sans 3, Segoe UI, Helvetica, Arial, sans-serif">
  <title>Ett typiskt hemnätverk</title>
  <rect width="900" height="460" fill="#ffffff"/>

  <!-- LAN-ram -->
  <rect x="250" y="30" width="630" height="410" rx="18" fill="#e8f3f5" fill-opacity="0.5" stroke="#509dab" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="866" y="58" text-anchor="end" font-size="16" font-weight="700" fill="#2f6e7a">Lokalt nätverk (LAN)</text>
  <text x="866" y="78" text-anchor="end" font-size="13" fill="#6b7780">privata adresser, t.ex. 192.168.1.x</text>

  <!-- Internet -->
  <path d="M60,250 C20,250 18,195 62,192 C62,150 122,140 140,172 C165,148 220,165 210,205 C245,210 240,252 205,252 Z" fill="#ffffff" stroke="#509dab" stroke-width="3"/>
  <text x="130" y="228" text-anchor="middle" font-size="20" font-weight="700" fill="#2f6e7a">Internet</text>
  <text x="130" y="290" text-anchor="middle" font-size="13" fill="#6b7780">(WAN)</text>

  <!-- Kabel internet - router -->
  <line x1="225" y1="225" x2="315" y2="225" stroke="#26323a" stroke-width="3"/>

  <!-- Router -->
  <rect x="315" y="190" width="200" height="70" rx="10" fill="#ffffff" stroke="#e38812" stroke-width="3"/>
  <text x="415" y="220" text-anchor="middle" font-size="17" font-weight="700" fill="#a85f05">Hemrouter</text>
  <text x="415" y="242" text-anchor="middle" font-size="12" fill="#26323a">router + brandvägg + switch + AP</text>
  <!-- antenner -->
  <line x1="360" y1="190" x2="350" y2="160" stroke="#e38812" stroke-width="3" stroke-linecap="round"/>
  <line x1="470" y1="190" x2="480" y2="160" stroke="#e38812" stroke-width="3" stroke-linecap="round"/>

  <!-- Trådbundet -->
  <line x1="415" y1="260" x2="415" y2="330" stroke="#26323a" stroke-width="3"/>
  <!-- Stationär dator -->
  <rect x="365" y="330" width="100" height="65" rx="5" fill="#ffffff" stroke="#509dab" stroke-width="3"/>
  <rect x="373" y="338" width="84" height="45" rx="2" fill="#e8f3f5"/>
  <rect x="400" y="395" width="30" height="10" fill="#509dab"/>
  <text x="415" y="428" text-anchor="middle" font-size="14" fill="#26323a">Dator (kabel)</text>
  <text x="315" y="300" text-anchor="middle" font-size="13" font-style="italic" fill="#6b7780">Ethernet-kabel</text>

  <!-- Trådlöst: vågor -->
  <g fill="none" stroke="#e38812" stroke-width="2.5" stroke-linecap="round">
    <path d="M520,200 q14,25 0,50"/>
    <path d="M535,190 q22,35 0,70"/>
    <path d="M550,180 q30,45 0,90"/>
  </g>
  <text x="560" y="300" font-size="13" font-style="italic" fill="#6b7780">wifi</text>

  <!-- Mobil -->
  <rect x="660" y="100" width="44" height="78" rx="8" fill="#ffffff" stroke="#509dab" stroke-width="3"/>
  <rect x="666" y="110" width="32" height="56" rx="2" fill="#e8f3f5"/>
  <text x="682" y="200" text-anchor="middle" font-size="14" fill="#26323a">Mobil</text>
  <!-- Laptop -->
  <rect x="740" y="205" width="90" height="56" rx="5" fill="#ffffff" stroke="#509dab" stroke-width="3"/>
  <rect x="748" y="212" width="74" height="42" rx="2" fill="#e8f3f5"/>
  <path d="M728,261 L842,261 L850,272 L720,272 Z" fill="#509dab"/>
  <text x="785" y="295" text-anchor="middle" font-size="14" fill="#26323a">Laptop</text>
  <!-- TV -->
  <rect x="640" y="330" width="120" height="70" rx="4" fill="#ffffff" stroke="#509dab" stroke-width="3"/>
  <rect x="648" y="337" width="104" height="56" rx="2" fill="#e8f3f5"/>
  <line x1="700" y1="400" x2="700" y2="410" stroke="#509dab" stroke-width="3"/>
  <line x1="680" y1="410" x2="720" y2="410" stroke="#509dab" stroke-width="3"/>
  <text x="700" y="430" text-anchor="middle" font-size="14" fill="#26323a">Smart-tv</text>

  <!-- streckade wifi-länkar -->
  <g stroke="#e38812" stroke-width="2" stroke-dasharray="5 5" fill="none">
    <line x1="575" y1="205" x2="655" y2="150"/>
    <line x1="580" y1="230" x2="735" y2="232"/>
    <line x1="575" y1="255" x2="650" y2="325"/>
  </g>
</svg>
