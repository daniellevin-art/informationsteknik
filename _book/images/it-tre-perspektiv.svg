<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Source Sans 3, Segoe UI, Helvetica, Arial, sans-serif">
  <title>Tre perspektiv på informationsteknik</title>
  <rect width="640" height="420" fill="#ffffff"/>
  <!-- Cirklar -->
  <circle cx="250" cy="170" r="130" fill="#509dab" fill-opacity="0.22" stroke="#509dab" stroke-width="3"/>
  <circle cx="390" cy="170" r="130" fill="#e38812" fill-opacity="0.18" stroke="#e38812" stroke-width="3"/>
  <circle cx="320" cy="285" r="130" fill="#2f6e7a" fill-opacity="0.14" stroke="#2f6e7a" stroke-width="3"/>

  <!-- Etiketter -->
  <text x="185" y="125" text-anchor="middle" font-size="24" font-weight="700" fill="#2f6e7a">Tekniken</text>
  <text x="185" y="150" text-anchor="middle" font-size="15" fill="#26323a">datorer, nätverk,</text>
  <text x="185" y="169" text-anchor="middle" font-size="15" fill="#26323a">lagring</text>

  <text x="460" y="125" text-anchor="middle" font-size="24" font-weight="700" fill="#a85f05">Människan</text>
  <text x="460" y="150" text-anchor="middle" font-size="15" fill="#26323a">interaktion,</text>
  <text x="460" y="169" text-anchor="middle" font-size="15" fill="#26323a">möjligheter,</text>
  <text x="460" y="188" text-anchor="middle" font-size="15" fill="#26323a">gränser</text>

  <text x="320" y="340" text-anchor="middle" font-size="24" font-weight="700" fill="#2f6e7a">Säkerheten</text>
  <text x="320" y="365" text-anchor="middle" font-size="15" fill="#26323a">skydd mot hot</text>
  <text x="320" y="384" text-anchor="middle" font-size="15" fill="#26323a">och missbruk</text>

  <!-- Mitten -->
  <circle cx="320" cy="210" r="34" fill="#ffffff" stroke="#26323a" stroke-width="2"/>
  <text x="320" y="219" text-anchor="middle" font-size="26" font-weight="700" fill="#26323a">IT</text>
</svg>
